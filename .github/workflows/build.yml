name: Windows build

on:
  push:
    paths-ignore:
      - VERSION
      - '.github/release-notes/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run core self-tests
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build/Release/FebiusYTMP3Downloader.exe' -ArgumentList '--self-test-core' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Core self-test failed with exit code $($p.ExitCode)." }

      - name: Verify portable MSVC runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
          $deps = & $dumpbin.FullName /DEPENDENTS build/Release/FebiusYTMP3Downloader.exe | Out-String
          if ($deps -match 'VCRUNTIME140(?:_1)?\.dll' -or $deps -match 'MSVCP140(?:_\d+)?\.dll') {
            throw 'Release EXE still depends on the Visual C++ runtime DLLs.'
          }

      - name: Download bundled tools
        shell: pwsh
        run: ./.github/scripts/prepare-payload.ps1

      - name: Build single-file EXE
        shell: pwsh
        run: |
          Compress-Archive -Path 'payload/*' -DestinationPath 'tools-payload.zip' -CompressionLevel Optimal -Force
          Copy-Item 'build/Release/FebiusYTMP3Downloader.exe' 'FebiusYTMP3Downloader.exe'
          $payload = [System.IO.File]::ReadAllBytes((Resolve-Path 'tools-payload.zip'))
          $out = [System.IO.File]::Open('FebiusYTMP3Downloader.exe', [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write)
          try {
            $out.Write($payload, 0, $payload.Length)
            $size = [BitConverter]::GetBytes([Int64]$payload.Length)
            $out.Write($size, 0, $size.Length)
            $magic = [Text.Encoding]::ASCII.GetBytes('YTMP3PK1')
            $out.Write($magic, 0, $magic.Length)
          } finally {
            $out.Dispose()
          }

      - name: Verify bundled tools
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\FebiusYTMP3Downloader.exe' -ArgumentList '--self-test-tools' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Bundled tool self-test failed with exit code $($p.ExitCode)." }

      - name: Upload single-file EXE
        uses: actions/upload-artifact@v4
        with:
          name: FebiusYTMP3Downloader-windows-x64
          path: FebiusYTMP3Downloader.exe
