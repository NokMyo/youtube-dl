name: Windows build

on:
  push:
    paths-ignore:
      - VERSION
      - '.github/release-notes/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run core self-tests
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build/Release/FebiusYTMP3Downloader.exe' -ArgumentList '--self-test-core' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Core self-test failed with exit code $($p.ExitCode)." }

      - name: Verify portable MSVC runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
          $deps = & $dumpbin.FullName /DEPENDENTS build/Release/FebiusYTMP3Downloader.exe | Out-String
          if ($deps -match 'VCRUNTIME140(?:_1)?\.dll' -or $deps -match 'MSVCP140(?:_\d+)?\.dll') {
            throw 'Release EXE still depends on the Visual C++ runtime DLLs.'
          }

      - name: Download bundled tools
        shell: pwsh
        run: ./.github/scripts/prepare-payload.ps1

      - name: Build single-file EXE
        shell: pwsh
        run: ./.github/scripts/build-single-file.ps1

      - name: Generate checksum
        shell: pwsh
        run: ./.github/scripts/sign-and-hash.ps1

      - name: Verify bundled tools
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\FebiusYTMP3Downloader.exe' -ArgumentList '--self-test-tools' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Bundled tool self-test failed with exit code $($p.ExitCode)." }

      - name: Upload single-file EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FebiusYTMP3Downloader-windows-x64
          path: |
            FebiusYTMP3Downloader.exe
            FebiusYTMP3Downloader.exe.sha256
            SIGNING_STATUS.txt
