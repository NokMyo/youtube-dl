name: Delete old releases once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-old-releases-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release delete v1.0.1 --yes || true

      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/delete-old-releases-once.yml'
          git commit -m 'Remove one-time release cleanup workflow'
          git push origin HEAD:main
