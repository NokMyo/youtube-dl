name: Remove obsolete releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-obsolete-releases.yml'

permissions:
  contents: write

jobs:
  remove-release-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete selected releases while preserving tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for release_id in 377102238 377765429 378349605; do
            response_file="$RUNNER_TEMP/delete-release-$release_id.json"
            status=$(curl --silent --show-error --location \
              --output "$response_file" --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/NokMyo/youtube-dl/releases/$release_id")
            if [[ "$status" != "204" && "$status" != "404" ]]; then
              cat "$response_file"
              exit 1
            fi
          done
