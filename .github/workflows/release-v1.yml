name: Release v1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/YouTubeMP3Downloader.exe dist/YouTubeMP3Downloader.exe
          Copy-Item README.md dist/README.md
          Copy-Item RELEASE_NOTES.md dist/RELEASE_NOTES.md
          Compress-Archive -Path dist/* -DestinationPath YouTubeMP3Downloader-v1.0-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          $title = 'YouTube MP3 Downloader v1.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag build/Release/YouTubeMP3Downloader.exe YouTubeMP3Downloader-v1.0-windows-x64.zip --clobber
          } else {
            gh release create $tag build/Release/YouTubeMP3Downloader.exe YouTubeMP3Downloader-v1.0-windows-x64.zip --target $env:GITHUB_SHA --title $title --notes-file RELEASE_NOTES.md
          }
