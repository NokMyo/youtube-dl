name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and notes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'VERSION must use the x.y.z format.'
          }
          $notes = ".github/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes were not found: $notes"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_FILE=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build core EXE
        run: cmake --build build --config Release

      - name: Run core self-tests
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build/Release/FebiusDownrush.exe' -ArgumentList '--self-test-core' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Core self-test failed with exit code $($p.ExitCode)." }

      - name: Verify portable MSVC runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
          $deps = & $dumpbin.FullName /DEPENDENTS build/Release/FebiusDownrush.exe | Out-String
          if ($deps -match 'VCRUNTIME140(?:_1)?\.dll' -or $deps -match 'MSVCP140(?:_\d+)?\.dll') {
            throw 'Release EXE still depends on the Visual C++ runtime DLLs.'
          }

      - name: Download bundled tools
        shell: pwsh
        run: ./.github/scripts/prepare-payload.ps1

      - name: Build single-file EXE
        shell: pwsh
        run: ./.github/scripts/build-single-file.ps1

      - name: Sign when certificate is configured and generate checksum
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/sign-and-hash.ps1

      - name: Verify bundled tools
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\FebiusDownrush.exe' -ArgumentList '--self-test-tools' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Bundled tool self-test failed with exit code $($p.ExitCode)." }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $title = "Febius Downrush v$env:VERSION"
          gh release create $tag FebiusDownrush.exe FebiusDownrush.exe.sha256 SIGNING_STATUS.txt `
            --target $env:GITHUB_SHA --title $title --notes-file $env:RELEASE_NOTES_FILE
