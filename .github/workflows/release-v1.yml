name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 1.1.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build core EXE
        run: cmake --build build --config Release

      - name: Verify portable MSVC runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
          $deps = & $dumpbin.FullName /DEPENDENTS build/Release/SeowolYTMP3Downloader.exe | Out-String
          if ($deps -match 'VCRUNTIME140(?:_1)?\.dll' -or $deps -match 'MSVCP140(?:_\d+)?\.dll') {
            throw 'Release EXE still depends on the Visual C++ runtime DLLs.'
          }

      - name: Download bundled tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'payload/yt-dlp.exe'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'ffmpeg.zip'
          Expand-Archive -LiteralPath 'ffmpeg.zip' -DestinationPath 'ffmpeg-dist' -Force
          $ffmpeg = Get-ChildItem 'ffmpeg-dist' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem 'ffmpeg-dist' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg binaries were not found.' }
          Copy-Item $ffmpeg.FullName 'payload/ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'payload/ffprobe.exe'
          @(
            'Bundled components:',
            '- yt-dlp: https://github.com/yt-dlp/yt-dlp',
            '- FFmpeg: https://ffmpeg.org/',
            '- Windows FFmpeg build: https://www.gyan.dev/ffmpeg/builds/',
            'See the upstream projects for their respective licenses and source code.'
          ) | Set-Content -Encoding UTF8 'payload/THIRD_PARTY_NOTICES.txt'

      - name: Build single-file EXE
        shell: pwsh
        run: |
          Compress-Archive -Path 'payload/*' -DestinationPath 'tools-payload.zip' -CompressionLevel Optimal -Force
          Copy-Item 'build/Release/SeowolYTMP3Downloader.exe' 'SeowolYTMP3Downloader.exe'
          $payload = [System.IO.File]::ReadAllBytes((Resolve-Path 'tools-payload.zip'))
          $out = [System.IO.File]::Open('SeowolYTMP3Downloader.exe', [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write)
          try {
            $out.Write($payload, 0, $payload.Length)
            $size = [BitConverter]::GetBytes([Int64]$payload.Length)
            $out.Write($size, 0, $size.Length)
            $magic = [Text.Encoding]::ASCII.GetBytes('YTMP3PK1')
            $out.Write($magic, 0, $magic.Length)
          } finally {
            $out.Dispose()
          }

      - name: Verify bundled tools
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\SeowolYTMP3Downloader.exe' -ArgumentList '--self-test-tools' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Bundled tool self-test failed with exit code $($p.ExitCode)." }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $title = "Seowol YT MP3 Downloader v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag SeowolYTMP3Downloader.exe --clobber
          } else {
            gh release create $tag SeowolYTMP3Downloader.exe --target $env:GITHUB_SHA --title $title --notes-file RELEASE_NOTES.md
          }
