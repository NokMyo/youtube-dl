name: Complete account sync integration

on:
  push:
    paths:
      - '.github/workflows/complete-account-sync.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sources
        run: python scripts/complete_sync_patch.py

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Core self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter FebiusDownrush.exe | Select-Object -First 1
          if (-not $exe) { throw 'FebiusDownrush.exe not found' }
          & $exe.FullName --self-test-core
          if ($LASTEXITCODE -ne 0) { throw "self-test failed: $LASTEXITCODE" }

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/account.h src/account.c src/main.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete Febius web link sync"
            git push origin main
          fi
