name: One-time main.c Seowol rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-mainc-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename internal branding
        shell: pwsh
        run: |
          $path = 'src/main.c'
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text.Replace('YouTube MP3 Downloader (C)', 'Seowol YT MP3 Downloader')
          $text = $text.Replace('YouTubeMP3Downloader', 'SeowolYTMP3Downloader')
          $text = $text.Replace('YTMP3ClassicWin32', 'SeowolYTMP3ClassicWin32')
          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM

          git rm '.github/workflows/rename-mainc-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.c
          git commit -m 'Rename internal app branding to Seowol'
          git push origin HEAD:main
