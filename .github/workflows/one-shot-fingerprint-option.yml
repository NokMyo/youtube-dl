name: One-shot fingerprint option migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fingerprint-option.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Add fingerprint duplicate option
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Once([string]$Path, [string]$Old, [string]$New) {
            $text = (Get-Content -LiteralPath $Path -Raw).Replace("`r`n", "`n")
            $oldNormalized = $Old.Replace("`r`n", "`n")
            $newNormalized = $New.Replace("`r`n", "`n")
            $count = ([regex]::Matches($text, [regex]::Escape($oldNormalized))).Count
            if ($count -ne 1) { throw "Expected exactly one match in $Path, found $count.`nOLD:`n$oldNormalized" }
            $text = $text.Replace($oldNormalized, $newNormalized)
            [IO.File]::WriteAllText((Resolve-Path $Path), $text, [Text.UTF8Encoding]::new($false))
          }

          Replace-Once 'src/main.c' @'
          #define IDM_OPT_AUTO_UPDATE     2045
          '@ @'
          #define IDM_OPT_AUTO_UPDATE     2045
          #define IDM_OPT_FINGERPRINT     2046
          '@

          Replace-Once 'src/main.c' @'
          static volatile LONG g_opt_size = 1;
          static volatile LONG g_audio_bitrate = 320;
          '@ @'
          static volatile LONG g_opt_size = 1;
          static volatile LONG g_opt_fingerprint = 1;
          static volatile LONG g_audio_bitrate = 320;
          '@

          Replace-Once 'src/main.c' @'
                  { L"ShowEstimatedSize", &g_opt_size },
                  { L"CheckUpdatesAtStartup", &g_auto_update }
          '@ @'
                  { L"ShowEstimatedSize", &g_opt_size },
                  { L"FingerprintDedup", &g_opt_fingerprint },
                  { L"CheckUpdatesAtStartup", &g_auto_update }
          '@

          Replace-Once 'src/main.c' @'
                  IDM_JOB_CLEAR, IDM_JOB_DELETE_SELECTED, IDM_OPT_DEDUP, IDM_OPT_SKIP,
                  IDM_OPT_SANITIZE, IDM_OPT_CLEAN, IDM_OPT_SIZE,
          '@ @'
                  IDM_JOB_CLEAR, IDM_JOB_DELETE_SELECTED, IDM_OPT_DEDUP, IDM_OPT_SKIP,
                  IDM_OPT_FINGERPRINT, IDM_OPT_SANITIZE, IDM_OPT_CLEAN, IDM_OPT_SIZE,
          '@

          Replace-Once 'src/main.c' @'
                  { IDM_OPT_SIZE, &g_opt_size },
                  { IDM_OPT_AUTO_UPDATE, &g_auto_update }
          '@ @'
                  { IDM_OPT_SIZE, &g_opt_size },
                  { IDM_OPT_FINGERPRINT, &g_opt_fingerprint },
                  { IDM_OPT_AUTO_UPDATE, &g_auto_update }
          '@

          Replace-Once 'src/main.c' @'
                  case IDM_OPT_SKIP: target = &g_opt_skip; setting_name = L"SkipDownloaded"; break;
                  case IDM_OPT_SANITIZE:
          '@ @'
                  case IDM_OPT_SKIP: target = &g_opt_skip; setting_name = L"SkipDownloaded"; break;
                  case IDM_OPT_FINGERPRINT:
                      target = &g_opt_fingerprint; setting_name = L"FingerprintDedup"; break;
                  case IDM_OPT_SANITIZE:
          '@

          Replace-Once 'src/main.c' @'
              AppendMenuW(g_options_menu, MF_STRING, IDM_OPT_SKIP, L"이미 다운로드한 곡 건너뛰기");
              AppendMenuW(g_options_menu, MF_STRING, IDM_OPT_SANITIZE, L"파일명 금지 문자 자동 제거");
          '@ @'
              AppendMenuW(g_options_menu, MF_STRING, IDM_OPT_SKIP, L"이미 다운로드한 곡 건너뛰기");
              AppendMenuW(g_options_menu, MF_STRING, IDM_OPT_FINGERPRINT, L"동일 녹음 음원 지문 중복 검사");
              AppendMenuW(g_options_menu, MF_STRING, IDM_OPT_SANITIZE, L"파일명 금지 문자 자동 제거");
          '@

          Replace-Once 'src/main.c' @'
                  case IDM_OPT_DEDUP:
                  case IDM_OPT_SKIP:
                  case IDM_OPT_SANITIZE:
          '@ @'
                  case IDM_OPT_DEDUP:
                  case IDM_OPT_SKIP:
                  case IDM_OPT_FINGERPRINT:
                  case IDM_OPT_SANITIZE:
          '@

          Replace-Once 'src/history.c' @'
          static BOOL FindFpcalc(wchar_t *out, size_t cch) {
          '@ @'
          static BOOL FingerprintDedupEnabled(void) {
              HKEY key = NULL;
              DWORD value = 1, type = 0, size = sizeof(value);
              if (RegOpenKeyExW(HKEY_CURRENT_USER, L"Software\\NokMyo\\Febius\\Downrush",
                                0, KEY_QUERY_VALUE, &key) != ERROR_SUCCESS) return TRUE;
              LONG status = RegQueryValueExW(key, L"FingerprintDedup", NULL, &type,
                                             (BYTE *)&value, &size);
              RegCloseKey(key);
              if (status != ERROR_SUCCESS) return TRUE;
              return type == REG_DWORD && size == sizeof(value) && value != 0;
          }

          static BOOL FindFpcalc(wchar_t *out, size_t cch) {
          '@

          Replace-Once 'src/history.c' @'
              if (SUCCEEDED(StringCchPrintfW(audio_path, MAX_PATH, L"%s\\%s", folder, actual_filename)) &&
                  FileExists(audio_path) && CalculateFingerprint(audio_path, fingerprint, sizeof(fingerprint))) {
          '@ @'
              if (FingerprintDedupEnabled() &&
                  SUCCEEDED(StringCchPrintfW(audio_path, MAX_PATH, L"%s\\%s", folder, actual_filename)) &&
                  FileExists(audio_path) && CalculateFingerprint(audio_path, fingerprint, sizeof(fingerprint))) {
          '@

          Replace-Once 'README.md' @'
          - 다운로드 기록 및 Chromaprint 오디오 지문 기반 중복 검사
          '@ @'
          - 다운로드 기록 및 Chromaprint 오디오 지문 기반 중복 검사
          - 옵션에서 `동일 녹음 음원 지문 중복 검사`를 독립적으로 켜고 끌 수 있음 (기본값: 켜짐)
          '@

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Core self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build/Release/FebiusDownrush.exe' -ArgumentList '--self-test-core' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Core self-test failed with exit code $($p.ExitCode)." }

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.c src/history.c README.md
          git commit -m 'Add optional audio fingerprint deduplication'
          git push origin HEAD:main
