name: Refine account UI
on:
  push:
    paths:
      - '.github/workflows/refine-account-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refine-account-ui.py
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release
      - run: .\build\Release\FebiusDownrush.exe --self-test-core
      - shell: pwsh
        run: |
          Remove-Item .github/scripts/refine-account-ui.py
          Remove-Item .github/workflows/refine-account-ui.yml
          git config user.name "NokMyo"
          git config user.email "82665094+NokMyo@users.noreply.github.com"
          git add src/main.c src/account.c .github/scripts/refine-account-ui.py .github/workflows/refine-account-ui.yml
          git commit -m "Refine Febius account menu and info UI"
          git push
