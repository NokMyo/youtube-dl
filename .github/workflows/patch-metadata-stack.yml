name: Patch metadata stack crash

on:
  push:
    branches: [fix/metadata-stack-crash]
    paths:
      - '.github/workflows/patch-metadata-stack.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/metadata-stack-crash
      - name: Patch duplicate compaction allocation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.c')
          s = p.read_text(encoding='utf-8')
          old1 = '''    Job temp[MAX_JOBS];\n    int out = 0;'''
          new1 = '''    Job *temp = (Job *)calloc(MAX_JOBS, sizeof(Job));\n    if (!temp) {\n        LeaveCriticalSection(&g_jobs_lock);\n        return;\n    }\n    int out = 0;'''
          old2 = '''    memcpy(g_jobs, temp, sizeof(Job) * out);\n    g_job_count = out;\n    LeaveCriticalSection(&g_jobs_lock);'''
          new2 = '''    memcpy(g_jobs, temp, sizeof(Job) * out);\n    g_job_count = out;\n    free(temp);\n    LeaveCriticalSection(&g_jobs_lock);'''
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Expected CompactDuplicates pattern not found exactly once')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.c
          git commit -m "Fix metadata duplicate stack overflow"
          git push origin HEAD:fix/metadata-stack-crash
