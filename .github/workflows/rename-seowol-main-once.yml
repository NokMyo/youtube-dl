name: One-time Seowol rebrand main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-seowol-main-once.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebrand project
        shell: pwsh
        run: |
          $targets = @(
            'src/main.c',
            'CMakeLists.txt',
            'build.bat',
            '.github/workflows/build.yml'
          )

          foreach ($path in $targets) {
            $text = Get-Content -Raw -LiteralPath $path
            $text = $text.Replace('YouTubeMP3Downloader', 'SeowolYTMP3Downloader')
            $text = $text.Replace('YouTube MP3 Downloader (C)', 'Seowol YT MP3 Downloader')
            $text = $text.Replace('YTMP3ClassicWin32', 'SeowolYTMP3ClassicWin32')
            Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          }

          @'
          # Seowol YT MP3 Downloader

          휴대폰에서 모아 둔 YouTube 링크를 Windows PC에서 한꺼번에 MP3로 정리해 내려받는 C + Win32 유틸리티입니다.

          화면은 Windows 98/2000 시절의 투박한 유틸리티 느낌을 유지하고, 실제 다운로드/변환 엔진은 `yt-dlp`, `ffmpeg`, `ffprobe`를 사용합니다. 공식 릴리스의 `SeowolYTMP3Downloader.exe`에는 이 도구들이 함께 포함되어 있어 별도 설치 없이 실행할 수 있습니다.

          > 본인이 소유했거나 다운로드가 허용된 콘텐츠 등 이용 권한이 있는 콘텐츠에 사용하세요.

          ## 주요 기능

          - 여러 YouTube 링크 한 번에 추가
          - `.txt` 링크 목록 불러오기
          - 중복 URL 및 동일 영상 ID 자동 제거
          - 이미 다운로드한 곡 건너뛰기 옵션
          - 실패한 항목만 다시 다운로드
          - Windows 파일명 금지 문자 자동 제거
          - `아티스트 - 곡명.mp3` 형태의 파일명 자동 정리
          - 원본 제목 / 정리된 파일명 미리보기
          - 다운로드 전 예상 MP3 용량 표시
          - 저장 폴더의 MP3 곡 수 / 총 용량 표시
          - `download_history.txt` 기반 다운로드 이력 관리
          - 순차 다운로드 및 개별/전체 진행률 표시

          ## 기본 저장 위치

          ```text
          Music\YouTubeMP3
          ```

          ## 단일 EXE 배포

          공식 릴리스에서는 아래 파일 하나만 받으면 됩니다.

          ```text
          SeowolYTMP3Downloader.exe
          ```

          첫 실행 시 내장된 `yt-dlp`, `ffmpeg`, `ffprobe`가 `%LOCALAPPDATA%\SeowolYTMP3Downloader\tools`에 자동으로 준비되고 이후 재사용됩니다.

          ## 빌드

          Visual Studio 2022 + CMake 기준:

          ```bat
          build.bat
          ```

          또는:

          ```bat
          cmake -S . -B build -A x64
          cmake --build build --config Release
          ```

          결과물:

          ```text
          build\Release\SeowolYTMP3Downloader.exe
          ```

          외부 GUI 라이브러리는 사용하지 않고 Windows 기본 Win32 API와 Common Controls를 사용합니다.

          ## 이름 자동 정리

          가능하면 `yt-dlp`가 제공하는 `artist` / `track` 정보를 우선 사용합니다. 정보가 없으면 제목을 규칙 기반으로 정리합니다.

          ```text
          Mrs. GREEN APPLE「点描の唄」Official Music Video
          → Mrs. GREEN APPLE - 点描の唄.mp3

          Lauv - I Like Me Better [Official Audio]
          → Lauv - I Like Me Better.mp3
          ```

          자동 정리가 완벽할 수는 없으므로 프로그램에서 최종 파일명을 미리 확인할 수 있습니다.

          ## 프로젝트 구조

          ```text
          .
          ├─ src/
          │  └─ main.c
          ├─ .github/workflows/
          │  ├─ build.yml
          │  └─ release-v1.yml
          ├─ CMakeLists.txt
          ├─ build.bat
          └─ README.md
          ```
          '@ | Set-Content -LiteralPath README.md -Encoding utf8NoBOM

          @'
          name: Release

          on:
            workflow_dispatch:
              inputs:
                version:
                  description: 'Version without v prefix (e.g. 1.1.0)'
                  required: true
                  default: '1.1.0'

          permissions:
            contents: write

          jobs:
            release:
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Configure
                  run: cmake -S . -B build -A x64

                - name: Build core EXE
                  run: cmake --build build --config Release

                - name: Verify portable MSVC runtime
                  shell: pwsh
                  run: |
                    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                    $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                    $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
                    if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
                    $deps = & $dumpbin.FullName /DEPENDENTS build/Release/SeowolYTMP3Downloader.exe | Out-String
                    if ($deps -match 'VCRUNTIME140(?:_1)?\.dll' -or $deps -match 'MSVCP140(?:_\d+)?\.dll') {
                      throw 'Release EXE still depends on the Visual C++ runtime DLLs.'
                    }

                - name: Download bundled tools
                  shell: pwsh
                  run: |
                    New-Item -ItemType Directory -Force payload | Out-Null
                    Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'payload/yt-dlp.exe'
                    Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'ffmpeg.zip'
                    Expand-Archive -LiteralPath 'ffmpeg.zip' -DestinationPath 'ffmpeg-dist' -Force
                    $ffmpeg = Get-ChildItem 'ffmpeg-dist' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
                    $ffprobe = Get-ChildItem 'ffmpeg-dist' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
                    if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg binaries were not found.' }
                    Copy-Item $ffmpeg.FullName 'payload/ffmpeg.exe'
                    Copy-Item $ffprobe.FullName 'payload/ffprobe.exe'
                    @'
                    Bundled components:
                    - yt-dlp: https://github.com/yt-dlp/yt-dlp
                    - FFmpeg: https://ffmpeg.org/
                    - Windows FFmpeg build: https://www.gyan.dev/ffmpeg/builds/
                    See the upstream projects for their respective licenses and source code.
                    '@ | Set-Content -Encoding UTF8 'payload/THIRD_PARTY_NOTICES.txt'

                - name: Build single-file EXE
                  shell: pwsh
                  run: |
                    Compress-Archive -Path 'payload/*' -DestinationPath 'tools-payload.zip' -CompressionLevel Optimal -Force
                    Copy-Item 'build/Release/SeowolYTMP3Downloader.exe' 'SeowolYTMP3Downloader.exe'
                    $payload = [System.IO.File]::ReadAllBytes((Resolve-Path 'tools-payload.zip'))
                    $out = [System.IO.File]::Open('SeowolYTMP3Downloader.exe', [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write)
                    try {
                      $out.Write($payload, 0, $payload.Length)
                      $size = [BitConverter]::GetBytes([Int64]$payload.Length)
                      $out.Write($size, 0, $size.Length)
                      $magic = [Text.Encoding]::ASCII.GetBytes('YTMP3PK1')
                      $out.Write($magic, 0, $magic.Length)
                    } finally {
                      $out.Dispose()
                    }

                - name: Verify bundled tools
                  shell: pwsh
                  run: |
                    $p = Start-Process -FilePath '.\SeowolYTMP3Downloader.exe' -ArgumentList '--self-test-tools' -PassThru -Wait
                    if ($p.ExitCode -ne 0) { throw "Bundled tool self-test failed with exit code $($p.ExitCode)." }

                - name: Create GitHub Release
                  shell: pwsh
                  env:
                    GH_TOKEN: ${{ github.token }}
                    VERSION: ${{ inputs.version }}
                  run: |
                    $tag = "v$env:VERSION"
                    $title = "Seowol YT MP3 Downloader v$env:VERSION"
                    gh release view $tag 2>$null
                    if ($LASTEXITCODE -eq 0) {
                      gh release upload $tag SeowolYTMP3Downloader.exe --clobber
                    } else {
                      gh release create $tag SeowolYTMP3Downloader.exe --target $env:GITHUB_SHA --title $title --notes-file RELEASE_NOTES.md
                    }
          '@ | Set-Content -LiteralPath '.github/workflows/release-v1.yml' -Encoding utf8NoBOM

          git rm '.github/workflows/rename-seowol-main-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.c CMakeLists.txt build.bat README.md .github/workflows/build.yml .github/workflows/release-v1.yml
          git commit -m 'Rebrand project as Seowol YT MP3 Downloader'
          git push origin HEAD:main
